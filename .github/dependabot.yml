version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: golang.org/x/crypto         # replaced by x-crypto fork
      - dependency-name: github.com/condatainer/x-crypto # bumped by bump_x_crypto workflow
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
